<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>bench video</title>
    <style>body { margin: 20px; background: #222; } video { display: block; width: 1280px; }</style>
</head>
<body>
    <!-- ?v=1080 | 720: the frame-coded clip (make-coded-video.py). Shown at 1280 CSS px wide in both cases. -->
    <video id="m" muted loop playsinline autoplay></video>
    <script>
        const q = new URLSearchParams(location.search);
        document.getElementById('m').src = '/media/bbb-coded-' + (q.get('v') || '1080') + 'p30.mp4';
    </script>
</body>
</html>
