<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Anaglyphohol - cold start</title>
<script>
  // Cold start: time from navigation start to the first 3D image. Every page load runs a fresh content script (its own
  // .NET runtime, GPU device and model), so a reload measures the whole cold path. window.__states lists each
  // anaglyphohol-state change with its time (ms since navigation start); the content script logs its model load
  // breakdown ("... loaded in N ms (device, fetch, build)") to the console.
  window.__states = [];
  new MutationObserver(ms => {
    for (const m of ms)
      window.__states.push(`${performance.now() | 0} ${m.target.id || m.target.tagName} ${m.target.getAttribute('anaglyphohol-state')}`);
  }).observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ['anaglyphohol-state'] });
</script>
<style> body { background: #222; color: #ddd; font-family: sans-serif; margin: 16px; } </style>
</head>
<body>
<p>One image, no video: the first 3D image waits for the whole cold path (runtime, GPU device, model, first forward).</p>
<img id="img-wide" src="photo-wide.jpg" width="640">
</body>
</html>
