<!doctype html>
<html><head><meta charset="utf-8"><title>Anaglyphohol - embedded player</title>
<style> body { background: #222; color: #ddd; font-family: sans-serif; margin: 16px; } iframe { border: 0; } </style></head>
<body>
<!-- A cross-origin embedded player: its iframe has no video until the player script builds one, so the lazy iframe
     boot (content.js) must wake on that late video. ?v= picks the YouTube video id. -->
<p>Embedded YouTube player (cross-origin iframe).</p>
<iframe id="player" width="640" height="360" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'aqz-KE-bpKQ';
  document.getElementById('player').src = 'https://www.youtube.com/embed/' + v + '?autoplay=1&mute=1';
</script>
</body></html>
