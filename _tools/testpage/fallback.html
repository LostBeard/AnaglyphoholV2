<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Anaglyphohol - image fallback</title>
<style> body { background: #222; color: #ddd; font-family: sans-serif; margin: 16px; } </style>
</head>
<body>
<!-- The "last usable image" fallback (store version 3.0.11). A search engine preview shows a readable thumbnail, then
     swaps in the original from a host that sends no CORS headers. Steps (window.__step):
       1. same-origin photo-wide.jpg                      -> anaglyph
       2. the SAME picture from another origin, no CORS     -> anaglyph, with anaglyphohol-fallback="1"
       3. a DIFFERENT-shaped picture from there, no CORS    -> failed (never the old picture)
     The other origin is a second static server: ?xo=http://127.0.0.1:8766 (python -m http.server 8766 --bind 127.0.0.1
     --directory _tools/testpage). -->
<p id="step">step 1</p>
<img id="img-swap" src="photo-wide.jpg" width="640">
<script>
  const xo = new URLSearchParams(location.search).get('xo') || 'http://127.0.0.1:8766';
  const img = document.getElementById('img-swap');
  window.__step = 1;
  window.next = () => {
    window.__step++;
    document.getElementById('step').textContent = 'step ' + window.__step;
    if (window.__step === 2) img.src = xo + '/photo-wide.jpg?nocors=1';
    if (window.__step === 3) img.src = xo + '/odd-301x437.png?nocors=1';
  };
</script>
</body>
</html>
